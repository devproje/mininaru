name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build every target
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            make dist GOOS="${target%/*}" GOARCH="${target#*/}" BRANCH="$TAG"
          done

      - name: archive and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          for dir in mininaru_*; do
            case "$dir" in
              *_windows_*) zip -qr "mininaru_${TAG}_${dir#mininaru_}.zip" "$dir" ;;
              *)           tar -czf "mininaru_${TAG}_${dir#mininaru_}.tar.gz" "$dir" ;;
            esac
          done
          sha256sum mininaru_"$TAG"_* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git tag -l --format='%(body)' "$TAG" > notes.md
          sed -i -E 's/(^|[^`])@(everyone|here)/\1`@\2`/g' notes.md
          if [ ! -s notes.md ]; then
            echo "tag has no annotation body, generating notes instead" >&2
            rm -f notes.md
          fi

          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, uploading assets to it" >&2
            gh release upload "$TAG" --clobber dist/mininaru_"$TAG"_* dist/SHA256SUMS
            exit 0
          fi

          if [ -f notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md $prerelease \
              dist/mininaru_"$TAG"_* dist/SHA256SUMS
          else
            gh release create "$TAG" --title "$TAG" --generate-notes $prerelease \
              dist/mininaru_"$TAG"_* dist/SHA256SUMS
          fi